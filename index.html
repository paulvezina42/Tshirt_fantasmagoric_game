<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fantasmagorie Wall</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body {
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #0f172a, #0b1220);
      color: white;
      overflow: hidden;
    }

    .word {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(32px, 10vw, 120px);
      text-transform: none;
      letter-spacing: 0.02em;
      text-shadow: 0 6px 30px rgba(0,0,0,0.6), 0 2px 8px rgba(255,255,255,0.03) inset;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .msg {
      position: absolute;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      pointer-events: none;
    }

    form {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 6px;
    }

    input {
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
    }

    button {
      padding: 4px 12px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>

  <script type="module">
    // Import Firebase SDK pieces
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

    // Firebase config (safe to expose in web clients)
    const firebaseConfig = {
      apiKey: "AIzaSyA-QVNklhINy_ov0qXHMq5blEueoC6l_fY",
      authDomain: "fantasmagoric-tshirt.firebaseapp.com",
      databaseURL: "https://fantasmagoric-tshirt-default-rtdb.firebaseio.com",
      projectId: "fantasmagoric-tshirt",
      storageBucket: "fantasmagoric-tshirt.firebasestorage.app",
      messagingSenderId: "912332373957",
      appId: "1:912332373957:web:4a57bc4abb448187b495ac"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form");
      const background = document.getElementById("background");

      form.addEventListener("submit", e => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const sentence = document.getElementById("sentence").value.trim();
        if (name && sentence) {
          push(ref(db, "messages"), { name, sentence });
          form.reset();
        }
      });

      onChildAdded(ref(db, "messages"), snapshot => {
        const data = snapshot.val();
        const div = document.createElement("div");
        div.className = "msg";
        div.textContent = `${data.name}: ${data.sentence}`;
        div.style.top = Math.random() * 90 + "%";
        div.style.left = Math.random() * 90 + "%";
        background.appendChild(div);
      });
    });
  </script>
</head>
<body>
  <div id="background"></div>
  <div class="word">fantasmagorie</div>

  <form id="form">
    <input id="name" type="text" placeholder="Your name" required />
    <input id="sentence" type="text" placeholder="Your sentence" required />
    <button type="submit">OK</button>
  </form>
</body>
</html>
