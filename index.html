<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas → ImgBB</title>
</head>
<body>
<canvas id="canvas" width="300" height="300" style="border:1px solid black;"></canvas>
<br>
<button id="uploadBtn">Upload Drawing</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Simple drawing logic
let drawing = false;
canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });
canvas.addEventListener("mousemove", (e) => {
    if (!drawing) return;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "black";
    ctx.lineCap = "round";
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

const apiKey = "ae1416b43b6f7cef2d2585e752d31d32";

document.getElementById("uploadBtn").addEventListener("click", async () => {
    // Convert canvas to base64
    const base64Image = canvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");

    // Send POST request to ImgBB
    const formData = new FormData();
    formData.append("key", apiKey);
    formData.append("image", base64Image);

    try {
        const response = await fetch("https://api.imgbb.com/1/upload", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        console.log("ImgBB URL:", data.data.url);
        alert("Drawing uploaded! URL: " + data.data.url);
    } catch (err) {
        console.error("Upload failed:", err);
    }
});
</script>
</body>
</html>
