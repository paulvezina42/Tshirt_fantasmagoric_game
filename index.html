<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasmagorie Paint Layers</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .toolbar {
    margin: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .bg-color {
    width: 30px;
    height: 30px;
    border: 2px solid white;
    cursor: pointer;
  }
  #canvasContainer {
    position: relative;
    width: 400px;
    height: 400px;
  }
  canvas {
    border: 2px solid white;
    position: absolute;
    top: 0;
    left: 0;
    touch-action: none;
  }
  input, button {
    padding: 4px 8px;
    border-radius: 4px;
    border: none;
  }
  button {
    background: #2563eb;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    background: #3b79ee;
  }
  button.active {
    background: #1a56d9;
    box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
  }
  #layersList {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 5px;
    justify-content: center;
  }
  .layerBtn {
    background: #444;
    color: white;
    padding: 2px 6px;
    cursor: pointer;
    border-radius: 4px;
  }
  .activeLayer {
    border: 2px solid #2563eb;
  }
  .opacity-preview {
    width: 100px;
    height: 20px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin-top: 5px;
  }
  .opacity-fill {
    height: 100%;
    background: currentColor;
  }
  .tool-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
  }
  .tool-label {
    font-size: 12px;
    margin-bottom: 3px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tool-group">
    <div class="tool-label">Couleur</div>
    <input type="color" id="colorPicker" value="#ffffff" title="Brush Color">
  </div>
  
  <div class="tool-group">
    <div class="tool-label">Opacité</div>
    <input type="range" id="brushOpacity" min="0.1" max="1" step="0.05" value="1" title="Brush Opacity">
    <div class="opacity-preview">
      <div class="opacity-fill" style="width: 100%;"></div>
    </div>
  </div>
  
  <div class="tool-group">
    <div class="tool-label">Taille</div>
    <input type="range" id="brushSize" min="1" max="50" value="5" title="Brush Size">
  </div>
  
  <button id="brushBtn" class="active">Brush</button>
  <button id="eraserBtn">Eraser</button>
  <button id="clearBtn">Clear Layer</button>

  <!-- Couleurs de fond temporaire -->
  <div class="bg-color" style="background:#111;" data-color="#111" title="Fond noir"></div>
  <div class="bg-color" style="background:#222;" data-color="#222" title="Fond gris foncé"></div>
  <div class="bg-color" style="background:#444;" data-color="#444" title="Fond gris moyen"></div>
  <div class="bg-color" style="background:#888;" data-color="#888" title="Fond gris clair"></div>

  <button id="addLayerBtn">+ Layer</button>
  <button id="uploadBtn">Upload Drawing</button>
</div>

<div id="layersList"></div>

<div id="canvasContainer">
  <canvas id="bgCanvas" width="400" height="400"></canvas>
</div>

<script>
const apiKey = "ae1416b43b6f7cef2d2585e752d31d32"; // <-- Remplacer par votre clé ImgBB

const canvasContainer = document.getElementById("canvasContainer");

// Background canvas
const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");
let bgColor = "#111";
function drawBackground() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  bgCtx.fillStyle = bgColor;
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
}
drawBackground();

// Layers management
let layers = [];
let activeLayerIndex = -1;
const layersListDiv = document.getElementById("layersList");

function addLayer() {
  const canvas = document.createElement("canvas");
  canvas.width = bgCanvas.width;
  canvas.height = bgCanvas.height;
  canvas.style.position = "absolute";
  canvas.style.top = "0";
  canvas.style.left = "0";
  canvas.style.zIndex = layers.length + 1;
  canvasContainer.appendChild(canvas);

  const ctx = canvas.getContext("2d");
  ctx.lineCap = "round";

  layers.push({canvas, ctx});
  activeLayerIndex = layers.length - 1;
  updateLayersUI();
}

function updateLayersUI() {
  layersListDiv.innerHTML = "";
  layers.forEach((layer, i) => {
    const btn = document.createElement("button");
    btn.textContent = "Layer " + (i+1);
    btn.className = "layerBtn";
    if(i === activeLayerIndex) btn.classList.add("activeLayer");
    btn.addEventListener("click", ()=> { activeLayerIndex = i; updateLayersUI(); });
    layersListDiv.appendChild(btn);
  });
}

function getActiveLayer() {
  if(activeLayerIndex < 0) return null;
  return layers[activeLayerIndex];
}

// Drawing logic
let drawing = false;
let mode = "brush";
let brushColor = document.getElementById("colorPicker").value;
let brushSize = document.getElementById("brushSize").value;
let brushOpacity = document.getElementById("brushOpacity").value;
let prevX, prevY;

// New: Create a temporary canvas for drawing
const tempCanvas = document.createElement('canvas');
tempCanvas.width = bgCanvas.width;
tempCanvas.height = bgCanvas.height;
const tempCtx = tempCanvas.getContext('2d');
tempCtx.lineCap = "round";
tempCtx.lineJoin = "round";

function startDraw(x, y) {
  const layer = getActiveLayer();
  if (!layer) return;
  drawing = true;
  
  // Set up temporary canvas for the current stroke
  tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
  
  if (mode === "brush") {
    tempCtx.strokeStyle = brushColor;
    tempCtx.lineWidth = brushSize;
    tempCtx.globalAlpha = brushOpacity;
    tempCtx.globalCompositeOperation = "source-over";
  } else if (mode === "eraser") {
    tempCtx.strokeStyle = 'rgba(0,0,0,1)';
    tempCtx.lineWidth = brushSize;
    tempCtx.globalAlpha = 1;
    tempCtx.globalCompositeOperation = "destination-out";
  }
  
  prevX = x;
  prevY = y;
  
  tempCtx.beginPath();
  tempCtx.moveTo(x, y);
}

function draw(x, y) {
  if (!drawing) return;
  
  tempCtx.lineTo(x, y);
  tempCtx.stroke();
  
  // Draw the temporary canvas onto the active layer
  const layer = getActiveLayer();
  if (layer) {
    layer.ctx.drawImage(tempCanvas, 0, 0);
  }
  
  prevX = x;
  prevY = y;
}

function stopDraw() {
  if (!drawing) return;
  drawing = false;
  
  // Clear the temporary canvas
  tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
}

// Update opacity preview
function updateOpacityPreview() {
  const opacityPreview = document.querySelector('.opacity-fill');
  if (opacityPreview) {
    opacityPreview.style.width = (brushOpacity * 100) + '%';
    opacityPreview.style.opacity = brushOpacity;
  }
}

// Mouse & Touch events
canvasContainer.addEventListener("mousedown", e => startDraw(e.offsetX, e.offsetY));
canvasContainer.addEventListener("mousemove", e => draw(e.offsetX, e.offsetY));
canvasContainer.addEventListener("mouseup", stopDraw);
canvasContainer.addEventListener("mouseleave", stopDraw);

canvasContainer.addEventListener("touchstart", e => {
  const rect = canvasContainer.getBoundingClientRect();
  const touch = e.touches[0];
  startDraw(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvasContainer.addEventListener("touchmove", e => {
  e.preventDefault();
  const rect = canvasContainer.getBoundingClientRect();
  const touch = e.touches[0];
  draw(touch.clientX - rect.left, touch.clientY - rect.top);
}, {passive: false});
canvasContainer.addEventListener("touchend", stopDraw);

// Toolbar
document.getElementById("brushBtn").addEventListener("click", () => {
  mode = "brush";
  document.getElementById("brushBtn").classList.add("active");
  document.getElementById("eraserBtn").classList.remove("active");
});
document.getElementById("eraserBtn").addEventListener("click", () => {
  mode = "eraser";
  document.getElementById("eraserBtn").classList.add("active");
  document.getElementById("brushBtn").classList.remove("active");
});
document.getElementById("colorPicker").addEventListener("change", e => {
  brushColor = e.target.value;
});
document.getElementById("brushOpacity").addEventListener("input", e => {
  brushOpacity = parseFloat(e.target.value);
  updateOpacityPreview();
});
document.getElementById("brushSize").addEventListener("input", e => {
  brushSize = e.target.value;
});
document.getElementById("clearBtn").addEventListener("click", () => {
  const layer = getActiveLayer();
  if(!layer) return;
  layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
});

// Background colors
document.querySelectorAll(".bg-color").forEach(div => {
  div.addEventListener("click", () => {
    bgColor = div.dataset.color;
    drawBackground();
  });
});

// Add new layer
document.getElementById("addLayerBtn").addEventListener("click", addLayer);

// Upload
document.getElementById("uploadBtn").addEventListener("click", async () => {
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = bgCanvas.width;
  exportCanvas.height = bgCanvas.height;
  const exportCtx = exportCanvas.getContext("2d");

  // Draw background first
  exportCtx.fillStyle = bgColor;
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  
  // Merge all layers
  layers.forEach(l => {
    exportCtx.drawImage(l.canvas, 0, 0);
  });

  const base64Image = exportCanvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");
  const formData = new FormData();
  formData.append("key", apiKey);
  formData.append("image", base64Image);

  try {
    const response = await fetch("https://api.imgbb.com/1/upload", {method: "POST", body: formData});
    const data = await response.json();
    alert("Drawing uploaded! URL: " + data.data.url);
    console.log("Uploaded URL:", data.data.url);
  } catch(err) {
    console.error(err);
    alert("Upload failed!");
  }
});

// Initial layer and setup
addLayer();
updateOpacityPreview();
</script>

</body>
</html>
