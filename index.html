<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fantasmagorie Wall</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/changeable-format.css">
  <script type="module">
    // Import Firebase SDK pieces
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

    // Firebase config (safe to expose in web clients)
    const firebaseConfig = {
      apiKey: "AIzaSyA-QVNklhINy_ov0qXHMq5blEueoC6l_fY",
      authDomain: "fantasmagoric-tshirt.firebaseapp.com",
      databaseURL: "https://fantasmagoric-tshirt-default-rtdb.firebaseio.com",
      projectId: "fantasmagoric-tshirt",
      storageBucket: "fantasmagoric-tshirt.firebasestorage.app",
      messagingSenderId: "912332373957",
      appId: "1:912332373957:web:4a57bc4abb448187b495ac"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form");
      const background = document.getElementById("background");

      form.addEventListener("submit", e => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const sentence = document.getElementById("sentence").value.trim();
        if (name && sentence) {
          push(ref(db, "messages"), { name, sentence });
          form.reset();
        }
      });

      onChildAdded(ref(db, "messages"), snapshot => {
        const data = snapshot.val();
        const div = document.createElement("div");
        div.className = "msg";
        div.textContent = `${data.name}: ${data.sentence}`;
        div.style.top = Math.random() * 90 + "%";
        div.style.left = Math.random() * 90 + "%";
        background.appendChild(div);
      });
    });
  </script>
</head>
<body>
  <div id="background"></div>
  <div class="word">fantasmagorie</div>

  <form id="form">
    <input id="name" type="text" placeholder="Your name" required />
    <input id="sentence" type="text" placeholder="Your sentence" required />
    <button type="submit">OK</button>
  </form>
</body>
</html>
