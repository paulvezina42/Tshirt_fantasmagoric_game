<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasmagorie Paint Transparent PNG</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .toolbar {
    margin: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .bg-color {
    width: 30px;
    height: 30px;
    border: 2px solid white;
    cursor: pointer;
  }
  canvas {
    border: 2px solid white;
    touch-action: none;
  }
  input, button {
    padding: 4px 8px;
    border-radius: 4px;
    border: none;
  }
  button {
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="toolbar">
  <input type="color" id="colorPicker" value="#ffffff" title="Brush Color">
  <input type="range" id="brushSize" min="1" max="50" value="5" title="Brush Size">
  <button id="brushBtn">Brush</button>
  <button id="eraserBtn">Eraser</button>
  <button id="clearBtn">Clear</button>

  <!-- Couleurs de fond temporaire -->
  <div class="bg-color" style="background:#111;" data-color="#111" title="Fond noir"></div>
  <div class="bg-color" style="background:#222;" data-color="#222" title="Fond gris foncé"></div>
  <div class="bg-color" style="background:#444;" data-color="#444" title="Fond gris moyen"></div>
  <div class="bg-color" style="background:#888;" data-color="#888" title="Fond gris clair"></div>

  <button id="uploadBtn">Upload Drawing</button>
</div>

<canvas id="paintCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d");

// Fond temporaire pour l'affichage
let bgColor = "#111";
function drawBackground() {
  ctx.save();
  ctx.globalCompositeOperation = "destination-over";
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
}
drawBackground();

// Brush / eraser
let drawing = false;
let brushColor = document.getElementById("colorPicker").value;
let brushSize = document.getElementById("brushSize").value;
let mode = "brush";

function startDraw(x, y) {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(x, y);
}

function draw(x, y) {
  if (!drawing) return;
  ctx.lineWidth = brushSize;
  ctx.strokeStyle = mode === "brush" ? brushColor : "rgba(0,0,0,1)";
  ctx.lineCap = "round";
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

function stopDraw() {
  drawing = false;
  ctx.beginPath();
}

// Events souris
canvas.addEventListener("mousedown", e => startDraw(e.offsetX, e.offsetY));
canvas.addEventListener("mousemove", e => draw(e.offsetX, e.offsetY));
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseleave", stopDraw);

// Events touch
canvas.addEventListener("touchstart", e => {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  startDraw(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  draw(touch.clientX - rect.left, touch.clientY - rect.top);
}, { passive: false });
canvas.addEventListener("touchend", stopDraw);

// Toolbar actions
document.getElementById("brushBtn").addEventListener("click", () => mode = "brush");
document.getElementById("eraserBtn").addEventListener("click", () => mode = "eraser");
document.getElementById("colorPicker").addEventListener("change", e => brushColor = e.target.value);
document.getElementById("brushSize").addEventListener("change", e => brushSize = e.target.value);
document.getElementById("clearBtn").addEventListener("click", () => {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
});

// Choix du fond temporaire
document.querySelectorAll(".bg-color").forEach(div => {
  div.addEventListener("click", () => {
    bgColor = div.dataset.color;
    drawBackground();
  });
});

// Upload vers ImgBB
const apiKey = "ae1416b43b6f7cef2d2585e752d31d32"; // <-- Remplacer par votre clé ImgBB
document.getElementById("uploadBtn").addEventListener("click", async () => {
  // Canvas temporaire uniquement avec le dessin
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext("2d");

  // Copie uniquement le dessin (ignore le fond)
  tempCtx.drawImage(canvas, 0, 0);

  // Supprime le fond temporaire pour transparence
  // On pourrait faire un clearRect avant pour être sûr
  const base64Image = tempCanvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");
  const formData = new FormData();
  formData.append("key", apiKey);
  formData.append("image", base64Image);

  try {
    const response = await fetch("https://api.imgbb.com/1/upload", {
      method: "POST",
      body: formData
    });
    const data = await response.json();
    alert("Drawing uploaded! URL: " + data.data.url);
    console.log("Uploaded URL:", data.data.url);
  } catch (err) {
    console.error("Upload failed:", err);
    alert("Upload failed!");
  }
});
</script>

</body>
</html>
